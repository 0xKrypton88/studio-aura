<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F3EB" />
  <title>Studio Aura – Bokningskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #f7f3eb;
      --surface: #fbf8f2;
      --surface-2: #f7f3eb;
      --sidebar: #faf7f2;
      --ink: #1c1a16;
      --muted: #6a6256;
      --soft: #8a8074;
      --line: rgba(28, 26, 22, 0.12);
      --line-strong: rgba(28, 26, 22, 0.18);
      --accent: #d2a06a;
      --accent-dark: #b4763f;
      --accent-soft: #e0bd8f;
      --accent-pale: rgba(180, 118, 63, 0.15);
      --sand: #f3e8d4;
      --closed: #efeae3;
      --success: #71816f;
      --danger: #a75d5d;
      --shadow: 0 22px 55px rgba(48, 40, 24, .10), 0 3px 12px rgba(48, 40, 24, .05);
      --shadow-soft: 0 10px 28px rgba(48, 40, 24, .06);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-body: 'Figtree', 'Segoe UI', sans-serif;
      --serif: var(--font-display);
      --sans: var(--font-body);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(201, 152, 102, .16), transparent 32%),
        radial-gradient(circle at 90% 92%, rgba(235, 227, 212, .55), transparent 36%),
        var(--page);
      overflow-x: clip;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    button:focus:not(:focus-visible),
    a:focus:not(:focus-visible) { outline: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-columns: 312px minmax(0, 1fr);
      width: calc(100vw - 30px);
      height: calc(100vh - 30px);
      margin: 15px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(210, 198, 188, .62);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px 18px 20px;
      overflow: auto;
      background:
        radial-gradient(circle at 78% 4%, rgba(201, 152, 102, .18), transparent 22%),
        linear-gradient(180deg, #fdfbf8 0%, #f7f3eb 100%);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 92px;
      padding: 2px 8px 20px;
      border-bottom: 1px solid rgba(229, 220, 212, .68);
    }
    .brand-logo-wrap {
      display: grid;
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      place-items: center;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(192, 174, 159, .52);
      border-radius: 50%;
      box-shadow: 0 8px 22px rgba(85, 61, 47, .09);
    }
    .brand-logo {
      width: 72px;
      height: 72px;
      object-fit: cover;
      transform: scale(1.04);
    }
    .brand-copy { min-width: 0; }
    .brand-name {
      margin: 0;
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .brand-tagline {
      margin-top: 7px;
      color: #9a7f6b;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .brand-back {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .18s ease, border-color .18s ease;
    }
    .brand-back:hover,
    .brand-back:focus-visible {
      color: var(--accent-dark);
      border-bottom-color: var(--accent-soft);
    }

    .sidebar-close {
      display: none;
      position: absolute;
      top: 16px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.8);
      cursor: pointer;
    }

    .nav-list {
      display: grid;
      gap: 5px;
      margin: 19px 0 18px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 13px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .18s ease, transform .18s ease, color .18s ease;
    }
    .nav-item:hover { background: rgba(226, 213, 202, .42); transform: translateX(2px); }
    .nav-item.active {
      background: var(--accent-dark);
      color: #fbf8f2;
      box-shadow: none;
    }
    .nav-item.active .nav-label { color: inherit; }
    .nav-icon { width: 19px; height: 19px; flex: 0 0 19px; }
    .nav-label { font-family: var(--serif); font-size: 16px; }

    .sidebar-card {
      margin-bottom: 14px;
      padding: 16px 17px;
      background: rgba(255,255,255,.79);
      border: 1px solid rgba(226, 216, 207, .8);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
    }
    .sidebar-card.glow {
      background:
        radial-gradient(circle at 92% 4%, rgba(201, 152, 102, .22), transparent 30%),
        rgba(255,255,255,.88);
    }
    .sidebar-card h3 {
      margin: 0 0 13px;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
    }
    .summary-row {
      display: grid;
      grid-template-columns: 24px 28px 1fr;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .summary-row strong { color: var(--ink); font-weight: 700; }
    .summary-row svg { width: 17px; height: 17px; }

    .upcoming-list { display: grid; gap: 3px; }
    .upcoming-item {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px;
      width: 100%;
      padding: 9px 0;
      border: 0;
      border-bottom: 1px solid rgba(232, 224, 217, .75);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .upcoming-item:last-child { border-bottom: 0; }
    .upcoming-time { font-size: 13px; font-weight: 700; }
    .upcoming-title { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 14px; font-weight: 700; }
    .upcoming-customer { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .tiny-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--accent-soft); }
    .sidebar-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #8468a7;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 13px;
    }
    .sidebar-link svg { width: 15px; height: 15px; }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }
    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 92px;
      padding: 19px 26px 18px 30px;
      background: rgba(255,253,251,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .topbar-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .menu-button {
      display: none;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      cursor: pointer;
    }
    .page-title {
      margin: 0;
      overflow: hidden;
      font-family: var(--serif);
      font-size: clamp(28px, 2.35vw, 40px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .segmented {
      display: inline-flex;
      padding: 3px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      box-shadow: 0 3px 10px rgba(56, 39, 28, .03);
    }
    .segment {
      min-width: 82px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 14px;
    }
    .segment.active { background: var(--accent-dark); color: #fbf8f2; box-shadow: none; }

    .primary-button, .secondary-button, .icon-button, .danger-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .primary-button {
      padding: 10px 18px;
      border: 1px solid var(--accent-dark);
      background: var(--accent-dark);
      color: #fbf8f2;
      box-shadow: 0 8px 20px rgba(106, 90, 53, .16);
      font-family: var(--serif);
    }
    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(111, 78, 58, .22); }
    .secondary-button {
      padding: 9px 15px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .secondary-button:hover, .icon-button:hover { background: var(--surface-2); }
    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      background: #fff;
    }
    .icon-button.bare { border-color: transparent; background: transparent; }
    .icon-button svg, .primary-button svg, .secondary-button svg { width: 18px; height: 18px; }
    .danger-button { padding: 9px 14px; border: 1px solid rgba(167,93,93,.25); background: #fff8f8; color: var(--danger); }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .avatar {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border-radius: 50%;
      background: #e8ded6;
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
    }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 18px 26px 24px 30px;
      background:
        radial-gradient(circle at 88% 2%, rgba(203,184,230,.06), transparent 22%),
        var(--surface);
    }

    .calendar-card, .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 25px rgba(54, 38, 28, .045);
    }
    .calendar-card { overflow: hidden; }
    .calendar-toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto minmax(330px, 1fr);
      align-items: center;
      gap: 16px;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #fffdfb);
    }
    .calendar-nav { display: flex; align-items: center; gap: 7px; }
    .calendar-label {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }
    .legend { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; }
    .legend-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-family: var(--serif);
      font-size: 13px;
      opacity: 1;
    }
    .legend-button.off { opacity: .38; text-decoration: line-through; }
    .legend-dot { width: 13px; height: 13px; border-radius: 50%; }
    .legend-dot.booked { background: #ded2c9; }
    .legend-dot.available { background: #fff; border: 1px dashed #d9ccc2; }
    .legend-dot.pause { background: #f7e7c9; }
    .legend-dot.closed { background: #ece9e7; }

    .calendar-scroll { overflow: auto; }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      min-width: 0;
      background: var(--line);
      gap: 1px;
    }
    .calendar-panel.compact .day-cell { min-height: 88px; padding: 7px 8px 6px; }
    .calendar-panel.compact .event-chip { min-height: 32px; padding: 4px 7px; }
    .calendar-panel.compact .event-title { font-size: 11px; }
    .calendar-panel.compact .weekday-head { min-height: 36px; font-size: 12px; }
    .weekday-head {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      min-height: 42px;
      place-items: center;
      background: #fffdfb;
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
    }
    .day-cell {
      position: relative;
      min-height: 118px;
      padding: 10px 10px 8px;
      overflow: hidden;
      background: #fff;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .day-cell:hover { background: #faf7f2; }
    .day-cell.outside { background: #f7f3eb; }
    .day-cell.selected { box-shadow: inset 0 0 0 2px rgba(143, 124, 78, .38); }
    .day-cell.today::after {
      content: "";
      position: absolute;
      inset: 4px;
      pointer-events: none;
      border: 1px solid rgba(145, 107, 83, .15);
      border-radius: 11px;
    }
    .day-top { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
    .day-number {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
    }
    .outside .day-number { color: #c9bcb2; }
    .today .day-number { background: var(--accent-dark); color: #fff; box-shadow: 0 4px 10px rgba(180,118,63,.22); }
    .quick-add {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--soft);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s, background .15s;
    }
    .day-cell:hover .quick-add, .day-cell:focus-within .quick-add { opacity: 1; }
    .quick-add:hover { background: var(--accent-pale); color: var(--accent-dark); }
    .events { display: grid; gap: 5px; margin-top: 2px; }
    .event-chip {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 7px 9px;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: transform .13s ease, filter .13s ease;
    }
    .event-chip:hover { transform: translateY(-1px); filter: brightness(.985); }
    .event-chip.booked { border: 1px solid rgba(143, 124, 78, .12); background: #e6ddd0; }
    .event-chip.available { border: 1px dashed #d8cbc1; background: #fff; }
    .event-chip.pause { border: 1px solid rgba(201, 152, 102, .18); background: #f3e8d4; }
    .event-chip.closed { border: 1px solid #eeeae7; background: var(--closed); color: #756d68; }
    .event-time { display: block; margin-bottom: 2px; font-size: 11px; font-weight: 700; }
    .event-title { display: block; overflow: hidden; font-family: var(--serif); font-size: 12px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .more-events {
      width: 100%;
      padding: 4px 7px;
      border: 0;
      background: transparent;
      color: #806c60;
      cursor: pointer;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
    }

    .week-wrap { min-width: 1120px; background: #fff; }
    .week-grid {
      display: grid;
      grid-template-columns: 72px repeat(7, minmax(145px, 1fr));
      background: var(--line);
      gap: 1px;
    }
    .week-corner, .week-day-head, .week-time, .week-slot { background: #fff; }
    .week-corner { min-height: 62px; }
    .week-day-head { display: grid; min-height: 62px; place-items: center; padding: 8px; text-align: center; }
    .week-day-name { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .week-day-date { display: grid; width: 31px; height: 31px; margin-top: 4px; place-items: center; border-radius: 50%; font-family: var(--serif); font-size: 16px; font-weight: 700; }
    .week-day-head.today .week-day-date { background: var(--accent); color: #fff; }
    .week-time { min-height: 76px; padding: 8px 9px; color: var(--muted); font-size: 11px; text-align: right; }
    .week-slot { min-height: 76px; padding: 5px; cursor: pointer; }
    .week-slot:hover { background: #fffaf6; }
    .week-event { min-height: 31px; margin-bottom: 4px; padding: 6px 7px; border-radius: 7px; cursor: pointer; font-size: 11px; }
    .week-event.booked { background: #e5dad2; }
    .week-event.available { background: #fff; border: 1px dashed #d6c8bd; }
    .week-event.pause { background: #faecd4; }
    .week-event.closed { background: #efedeb; }

    .day-view { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; padding: 18px; background: #faf8f5; }
    .day-agenda { overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .agenda-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); min-height: 75px; border-bottom: 1px solid var(--line); }
    .agenda-row:last-child { border-bottom: 0; }
    .agenda-time { padding: 15px 13px; color: var(--muted); font-size: 12px; text-align: right; }
    .agenda-slot { padding: 7px; border-left: 1px solid var(--line); cursor: pointer; }
    .agenda-slot:hover { background: #fffaf6; }
    .agenda-event { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 54px; padding: 10px 13px; border-radius: 9px; cursor: pointer; }
    .agenda-event.booked { background: #e6dbd3; }
    .agenda-event.available { border: 1px dashed #d4c6bc; background: #fff; }
    .agenda-event.pause { background: #fbedda; }
    .agenda-event.closed { background: #efedeb; }
    .agenda-title { font-family: var(--serif); font-weight: 700; }
    .agenda-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .day-side { display: grid; align-content: start; gap: 14px; }

    .page-stack { display: grid; gap: 18px; }
    .hero-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      min-height: 150px;
      padding: 27px 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at 90% 10%, rgba(197, 172, 231, .30), transparent 28%),
        linear-gradient(135deg, #f7f0ea, #fffdfb 68%);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .hero-panel h2 { margin: 0 0 9px; font-family: var(--serif); font-size: 32px; font-weight: 500; }
    .hero-panel p { max-width: 650px; margin: 0; color: var(--muted); line-height: 1.6; }
    .hero-orb { width: 104px; height: 104px; flex: 0 0 104px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #d8c5b7 54%, #a88771); box-shadow: inset -12px -13px 25px rgba(86,59,42,.12), 0 18px 30px rgba(90,62,44,.12); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .stat-card { padding: 19px; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: 0 7px 20px rgba(58,41,31,.04); cursor: pointer; }
    .stat-top { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .stat-icon { display: grid; width: 33px; height: 33px; place-items: center; border-radius: 10px; background: var(--accent-pale); }
    .stat-icon svg { width: 17px; height: 17px; }
    .stat-value { margin-top: 17px; font-family: var(--serif); font-size: 32px; }
    .stat-foot { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr); gap: 18px; }
    .panel { padding: 20px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 16px; }
    .panel-title { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; }
    .clean-list { display: grid; gap: 9px; }
    .clean-row { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 12px; padding: 12px 11px; border: 1px solid var(--line); border-radius: 11px; background: #fffdfb; }
    .clean-time { font-weight: 700; }
    .clean-title { font-family: var(--serif); font-weight: 700; }
    .clean-sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status-pill { padding: 5px 8px; border-radius: 999px; background: #e7ded7; color: #5f4d42; font-size: 10px; font-weight: 700; }
    .progress-list { display: grid; gap: 16px; }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: #eee8e3; }
    .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #cbb7a8, #987963); }

    .section-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .search-box { position: relative; width: min(420px, 100%); }
    .search-box svg { position: absolute; top: 50%; left: 13px; width: 17px; height: 17px; transform: translateY(-50%); color: var(--soft); }
    .search-box input { width: 100%; height: 44px; padding: 0 14px 0 41px; border: 1px solid var(--line); border-radius: 11px; outline: none; background: #fff; color: var(--ink); }
    .search-box input:focus { border-color: #baa18f; box-shadow: 0 0 0 4px rgba(184,154,133,.12); }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { padding: 13px 15px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; text-align: left; text-transform: uppercase; letter-spacing: .08em; }
    .data-table td { padding: 14px 15px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .data-table tbody tr { cursor: pointer; }
    .data-table tbody tr:hover { background: #fffaf6; }
    .customer-cell { display: flex; align-items: center; gap: 11px; }
    .customer-avatar { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 50%; background: #e9dfd7; font-family: var(--serif); font-weight: 700; }
    .table-scroll { overflow: auto; }

    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }

    .service-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; border-radius: 16px 16px 0 0; background: linear-gradient(90deg, #c7b2a2, #eaded5); }
    .service-card h3, .person-card h3 { margin: 8px 0 6px; font-family: var(--serif); font-size: 20px; }
    .service-card p, .person-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .service-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .price { font-family: var(--serif); font-size: 19px; font-weight: 700; }
    .person-top { display: flex; align-items: center; gap: 13px; }
    .person-avatar { display: grid; width: 54px; height: 54px; place-items: center; border-radius: 50%; background: linear-gradient(135deg, #efe6df, #d6c1b2); font-family: var(--serif); font-size: 20px; font-weight: 700; }
    .person-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--success); font-size: 11px; font-weight: 700; }
    .person-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .7fr); gap: 18px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-title { font-family: var(--serif); font-weight: 700; }
    .setting-sub { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .toggle { position: relative; width: 48px; height: 27px; flex: 0 0 48px; padding: 0; border: 0; border-radius: 999px; background: #d9d1cb; cursor: pointer; transition: background .18s; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(44,30,21,.18); transition: transform .18s; }
    .toggle.on { background: #9a7c67; }
    .toggle.on::after { transform: translateX(21px); }
    .hours-grid { display: grid; gap: 10px; }
    .hours-row { display: grid; grid-template-columns: 1fr 85px 14px 85px; align-items: center; gap: 8px; }
    .hours-row input { width: 100%; height: 37px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }

    .popover {
      position: fixed;
      z-index: 90;
      width: 250px;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 18px 40px rgba(54,37,27,.17);
      animation: pop .15s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(-5px) scale(.98); } to { opacity: 1; transform: none; } }
    .popover-title { padding: 8px 9px 10px; font-family: var(--serif); font-weight: 700; }
    .popover-item { display: flex; gap: 10px; width: 100%; padding: 10px 9px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
    .popover-item:hover { background: #faf5f1; }
    .notification-dot { width: 8px; height: 8px; margin-top: 5px; flex: 0 0 8px; border-radius: 50%; background: #9c7b66; }
    .popover-small { color: var(--muted); font-size: 11px; margin-top: 3px; }

    .modal-backdrop {
      position: fixed;
      z-index: 120;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(45, 34, 28, .34);
      backdrop-filter: blur(5px);
      animation: fade .17s ease-out;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: min(590px, 100%);
      max-height: min(780px, calc(100vh - 40px));
      overflow: auto;
      background: #fffdfb;
      border: 1px solid rgba(226,216,207,.9);
      border-radius: 19px;
      box-shadow: 0 30px 80px rgba(38,27,20,.22);
      animation: modalIn .2s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
    .modal-title { margin: 0; font-family: var(--serif); font-size: 27px; font-weight: 500; }
    .modal-body { padding: 20px 22px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #5f5149; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line-strong); border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #b2937e; box-shadow: 0 0 0 4px rgba(178,147,126,.12); }
    .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px 21px; border-top: 1px solid var(--line); }
    .modal-foot-right { display: flex; gap: 10px; }

    .toast {
      position: fixed;
      z-index: 160;
      right: 26px;
      bottom: 26px;
      display: flex;
      align-items: center;
      gap: 11px;
      max-width: 390px;
      padding: 13px 16px;
      background: #3f3028;
      color: #fff;
      border-radius: 11px;
      box-shadow: 0 15px 35px rgba(39,28,22,.22);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast svg { width: 18px; height: 18px; }

    .empty-state { padding: 55px 20px; color: var(--muted); text-align: center; }
    .empty-state h3 { margin: 0 0 8px; color: var(--ink); font-family: var(--serif); font-size: 22px; }

    .mobile-scrim { display: none; }

    @media (max-width: 1440px) {

      .topbar { padding: 16px 20px 16px 22px; min-height: 84px; }
      .content { padding: 16px 18px 20px; }
    }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 270px minmax(0,1fr); }
      .month-grid {
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        min-width: 790px;
      }
      .brand-logo-wrap { flex-basis: 58px; width: 58px; height: 58px; }
      .brand-logo { width: 58px; height: 58px; }

      .brand-tagline { font-size: 8px; }
      .sidebar { padding-left: 14px; padding-right: 14px; }

      .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 900px) {
      html, body { overflow: hidden; overflow-x: clip; }
      .app-shell { grid-template-columns: minmax(0,1fr); width: 100%; max-width: 100vw; height: 100vh; height: 100dvh; margin: 0; border: 0; border-radius: 0; }
      .month-grid {
        grid-template-columns: repeat(7, minmax(108px, 1fr));
        min-width: 780px;
      }
      .week-wrap { min-width: 920px; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); transform: translateX(-102%); transition: transform .22s ease; box-shadow: 18px 0 50px rgba(42,29,21,.18); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: grid; place-items: center; }
      .mobile-scrim { position: fixed; z-index: 25; inset: 0; display: block; background: rgba(45,33,26,.32); opacity: 0; pointer-events: none; transition: opacity .2s; }
      .mobile-scrim.show { opacity: 1; pointer-events: auto; }
      .menu-button { display: grid; }
      .topbar { min-height: 78px; padding: 14px 16px; }
      .content { padding: 14px 14px 20px; }
      .segmented { display: none; }
      .topbar-actions .icon-button { display: none; }
      .page-title { font-size: 30px; }
      .two-col, .settings-grid, .day-view { grid-template-columns: 1fr; }
      .day-side { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 650px) {
      .page-title { font-size: 24px; letter-spacing: -.02em; }
      .topbar { gap: 10px; padding: 12px 12px 12px 14px; min-height: 68px; }
      .topbar-actions { gap: 8px; }
      .primary-button .button-text { display: none; }
      .primary-button { width: 42px; padding: 0; }
      .profile-button { display: none; }
      .calendar-toolbar { grid-template-columns: 1fr; align-items: start; }
      .calendar-label { grid-row: 1; text-align: left; }
      .calendar-nav { grid-row: 2; }
      .legend { grid-row: 3; gap: 10px 14px; }
      .stats-grid, .card-grid, .day-side { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .hero-orb { display: none; }
      .hero-panel { padding: 22px; }
      .section-toolbar { align-items: stretch; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .modal-foot { align-items: stretch; flex-direction: column-reverse; }
      .modal-foot-right { width: 100%; }
      .modal-foot-right > * { flex: 1; }
      .hours-row { grid-template-columns: 1fr 75px 10px 75px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Huvudmeny">
      <button class="sidebar-close" type="button" data-action="close-sidebar" aria-label="Stäng meny">✕</button>

        { id: "c2", name: "Maria Svensson", email: "maria.svensson@example.se", phone: "073-882 10 42", visits: 7, lastVisit: "2025-05-13" },

      const staff = [
        { name: "Emma Karlsson", initials: "EK", role: "Studioansvarig", status: "På plats idag", specialty: "Kundservice och hudrådgivning" },
        { name: "Lina Sjöberg", initials: "LS", role: "Hudterapeut", status: "På plats idag", specialty: "Ansiktsbehandlingar" },
        { name: "Maja Nyberg", initials: "MN", role: "Hudterapeut", status: "Nästa pass 17 maj", specialty: "Rödljus och hudvård" }

      const defaultSettings = {

      const restored = loadState();
      const state = {
        activeSection: restored.activeSection || "bookings",
        calendarView: restored.calendarView || "month",
        cursor: restored.cursor ? dateFromISO(restored.cursor) : new Date(2025, 4, 1),
        selectedDate: restored.selectedDate ? dateFromISO(restored.selectedDate) : new Date(demoToday),
        events: Array.isArray(restored.events) ? restored.events : [],

        filters: new Set(restored.filters || ["booked", "available", "pause", "closed"]),

        customerQuery: ""
