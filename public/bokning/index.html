      ensureMonthEvents(state.cursor.getFullYear(), state.cursor.getMonth());
      ensureMonthEvents(2025, 4);
      persist();
      renderApp();

      function loadState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function persist() {
        const serializable = {
          activeSection: state.activeSection,
          calendarView: state.calendarView,
          cursor: toISO(state.cursor),
          selectedDate: toISO(state.selectedDate),
          events: state.events,
          initializedMonths: [...state.initializedMonths],
          filters: [...state.filters],
          customers: state.customers,
          settings: state.settings
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable));
        } catch {
          /* Prototypen fungerar även när webbläsaren blockerar lokal lagring. */
        }
      }

      function dateFromISO(value) {
        const [y, m, d] = String(value).split("-").map(Number);
        return new Date(y, m - 1, d, 12, 0, 0, 0);
      }
      function toISO(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function monthKey(year, month) { return `${year}-${String(month + 1).padStart(2, "0")}`; }
      function addDays(date, amount) { const copy = new Date(date); copy.setDate(copy.getDate() + amount); return copy; }
      function startOfWeek(date) { const copy = new Date(date); const offset = (copy.getDay() + 6) % 7; copy.setDate(copy.getDate() - offset); return copy; }
      function capitalize(value) { return value ? value.charAt(0).toUpperCase() + value.slice(1) : value; }
      function formatDate(date, options) { return new Intl.DateTimeFormat("sv-SE", options).format(date); }
      function sameDate(a, b) { return toISO(a) === toISO(b); }
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
      function uid(prefix = "id") { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }

      function ensureMonthEvents(year, month) {
        const key = monthKey(year, month);
        if (state.initializedMonths.has(key)) return;

        const lastDay = new Date(year, month + 1, 0).getDate();
        const customerNames = defaultCustomers.map(c => c.name);
        const bookedTimes = { 1: "09:00", 2: "11:00", 3: "15:00", 4: "09:30", 5: "10:00" };
        const serviceCycle = ["Soltid 20 min", "Ansiktsbehandling", "Konsultation", "Soltid 30 min", "Rödljusbehandling"];

        for (let day = 1; day <= lastDay; day++) {
          const date = new Date(year, month, day, 12);
          const dow = date.getDay();
          const iso = toISO(date);

          if (dow === 0) {
            state.events.push({ id: uid("seed"), date: iso, time: "10:00", title: "Stängt", customer: "", resource: "", duration: 0, status: "closed", notes: "" });
            continue;
          }

          if (dow === 6) {
            state.events.push({ id: uid("seed"), date: iso, time: "10:00", title: "Ledig tid", customer: "", resource: "Solarium 1", duration: 20, status: "available", notes: "" });
            state.events.push({ id: uid("seed"), date: iso, time: day % 2 ? "14:00" : "14:30", title: "Ledig tid", customer: "", resource: "Solarium 2", duration: 20, status: "available", notes: "" });
            continue;
          }

          const service = serviceCycle[(day + dow) % serviceCycle.length];
          state.events.push({
            id: uid("seed"),
            date: iso,
            time: bookedTimes[dow],
            title: service,
            customer: customerNames[(day + month) % customerNames.length],
            resource: `Solarium ${(day % 3) + 1}`,
            duration: service.includes("Ansikts") ? 50 : service.includes("Konsultation") ? 20 : service.includes("Rödljus") ? 30 : service.includes("30") ? 30 : 20,
            status: "booked",
            notes: ""
          });

          if (dow === 2 || dow === 5) {
            state.events.push({ id: uid("seed"), date: iso, time: dow === 5 ? "13:30" : "13:00", title: "Paus", customer: "", resource: "", duration: 30, status: "pause", notes: "" });
          } else {
            const freeTime = dow === 1 ? "13:00" : dow === 3 ? "17:00" : "12:00";
            state.events.push({ id: uid("seed"), date: iso, time: freeTime, title: "Ledig tid", customer: "", resource: `Solarium ${(day % 2) + 1}`, duration: 20, status: "available", notes: "" });
          }
        }

        if (year === 2025 && month === 4) {
          const specialDate = "2025-05-16";
          state.events = state.events.filter(event => event.date !== specialDate);
          const special = [
            ["08:30", "Soltid 20 min", "Anna Andersson", "Solarium 1", 20, "booked"],
            ["09:00", "Soltid 20 min", "Elin Berg", "Solarium 2", 20, "booked"],
            ["09:30", "Konsultation", "Nora Ek", "Rum 1", 20, "booked"],
            ["10:00", "Soltid 20 min", "Maria Svensson", "Solarium 3", 20, "booked"],
            ["11:00", "Ansiktsbehandling", "Sara Lind", "Behandlingsrum", 50, "booked"],
            ["12:00", "Paus", "", "", 30, "pause"],
            ["13:00", "Rödljusbehandling", "Olivia Holm", "Rödljus 1", 30, "booked"],
            ["14:00", "Soltid 30 min", "Johan Karlsson", "Solarium 1", 30, "booked"],
            ["15:00", "Konsultation", "Maja Ek", "Rum 1", 20, "booked"],
            ["16:00", "Ledig tid", "", "Solarium 2", 20, "available"],
            ["17:00", "Ledig tid", "", "Solarium 3", 20, "available"]
          ];
          special.forEach(([time, title, customer, resource, duration, status]) => {
            state.events.push({ id: uid("seed"), date: specialDate, time, title, customer, resource, duration, status, notes: "" });
          });
        }

        state.initializedMonths.add(key);
      }

      function eventsForDate(date) {
        const iso = typeof date === "string" ? date : toISO(date);
        return state.events
          .filter(event => event.date === iso)
          .sort((a, b) => a.time.localeCompare(b.time));
      }

      function bookedEventsFrom(date) {
        const iso = toISO(date);
        return state.events
          .filter(event => event.status === "booked" && (event.date > iso || event.date === iso))
          .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
      }

      function sectionTitle() {
        return {
          overview: "Översikt",
          bookings: "Bokningskalender",
          customers: "Kunder",
          services: "Tjänster",
          staff: "Personal",
          settings: "Inställningar"
        }[state.activeSection] || "Studio Aura";
      }

      function renderApp() {
        renderNav();
        renderSidebar();
        renderTopbar();
        renderContent();
      }

      function renderNav() {
        document.getElementById("navList").innerHTML = navItems.map(item => `
          <button class="nav-item ${state.activeSection === item.id ? "active" : ""}" type="button" data-action="nav" data-section="${item.id}">
            ${icon(item.icon, "nav-icon")}
            <span class="nav-label">${item.label}</span>
          </button>
        `).join("");
      }

      function renderSidebar() {
        const selected = demoToday;
        const todayEvents = eventsForDate(selected);
        const bookedCount = todayEvents.filter(e => e.status === "booked").length;
        const freeCount = todayEvents.filter(e => e.status === "available").length;
        const upcoming = bookedEventsFrom(selected).slice(0, 3);

        document.getElementById("sidebarDynamic").innerHTML = `
          <section class="sidebar-card glow">
            <h3>Idag · ${selected.getDate()} ${monthNames[selected.getMonth()]} ${selected.getFullYear()}</h3>
            <div class="summary-row">${icon("calendar")}<strong>${bookedCount}</strong><span>Bokningar</span></div>
            <div class="summary-row">${icon("user")}<strong>3</strong><span>Nya kunder</span></div>
            <div class="summary-row">${icon("clock")}<strong>${freeCount}</strong><span>Lediga tider</span></div>
          </section>
          <section class="sidebar-card">
            <h3>Kommande bokningar</h3>
            <div class="upcoming-list">
              ${upcoming.map(event => `
                <button class="upcoming-item" type="button" data-action="open-event" data-event-id="${event.id}">
                  <span class="upcoming-time">${event.time}</span>
                  <span>
                    <span class="upcoming-title"><span class="tiny-dot"></span>${escapeHtml(event.title)}</span>
                    <span class="upcoming-customer">${escapeHtml(event.customer)}</span>
                  </span>
                </button>
              `).join("") || `<div class="empty-state" style="padding:18px 0">Inga bokningar.</div>`}
            </div>
            <button class="sidebar-link" type="button" data-action="nav" data-section="bookings">Visa alla bokningar ${icon("arrow")}</button>
          </section>
        `;
      }

      function renderTopbar() {
        const bookingsControls = state.activeSection === "bookings" ? `
          <div class="segmented" aria-label="Kalendervy">
            ${["month", "week", "day"].map(view => `
              <button class="segment ${state.calendarView === view ? "active" : ""}" type="button" data-action="view" data-view="${view}">
                ${{ month: "Månad", week: "Vecka", day: "Dag" }[view]}
              </button>
            `).join("")}
          </div>
        ` : "";

        let mainAction = "Ny bokning";
        let action = "new-booking";
        if (state.activeSection === "customers") { mainAction = "Ny kund"; action = "new-customer"; }
        if (state.activeSection === "services") { mainAction = "Ny tjänst"; action = "new-service"; }
        if (state.activeSection === "staff") { mainAction = "Ny profil"; action = "new-staff"; }
        if (state.activeSection === "settings") { mainAction = "Spara"; action = "save-settings"; }

        document.getElementById("topbar").innerHTML = `
          <div class="topbar-left">
            <button class="menu-button" type="button" data-action="open-sidebar" aria-label="Öppna meny">${icon("menu")}</button>
            <h1 class="page-title">${sectionTitle()}</h1>
          </div>
          <div class="topbar-actions">
            ${bookingsControls}
            <button class="primary-button" type="button" data-action="${action}">${icon(state.activeSection === "settings" ? "check" : "plus")}<span class="button-text">${mainAction}</span></button>
            <button class="icon-button bare" type="button" data-action="notifications" aria-label="Notiser">${icon("bell")}</button>
            <button class="profile-button" type="button" data-action="profile-menu" aria-label="Profilmeny">
              <span class="avatar">EK</span>${icon("chevronDown")}
            </button>
          </div>
        `;
      }

      function renderContent() {
        const content = document.getElementById("content");
        if (state.activeSection === "bookings") content.innerHTML = renderBookings();
        else if (state.activeSection === "overview") content.innerHTML = renderOverview();
        else if (state.activeSection === "customers") content.innerHTML = renderCustomers();
        else if (state.activeSection === "services") content.innerHTML = renderServices();
        else if (state.activeSection === "staff") content.innerHTML = renderStaff();
        else if (state.activeSection === "settings") content.innerHTML = renderSettings();
      }

      function renderBookings() {
        ensureMonthEvents(state.cursor.getFullYear(), state.cursor.getMonth());
        const label = calendarLabel();
        return `
          <div class="calendar-card calendar-panel ${state.settings.compactMode ? "compact" : ""}">
            <div class="calendar-toolbar">
              <div class="calendar-nav">
                <button class="icon-button" type="button" data-action="calendar-prev" aria-label="Föregående">${icon("chevronLeft")}</button>
                <button class="icon-button" type="button" data-action="calendar-next" aria-label="Nästa">${icon("chevronRight")}</button>
                <button class="secondary-button" type="button" data-action="calendar-today">Idag</button>
              </div>
              <h2 class="calendar-label">${label}</h2>
              <div class="legend">
                ${[
                  ["booked", "Bokad"], ["available", "Ledig tid"], ["pause", "Lunch / Paus"], ["closed", "Stängt"]
                ].map(([status, label]) => {
                  const off = !state.filters.has(status) || (status === "available" && !state.settings.showAvailability);
                  return `
                  <button class="legend-button ${off ? "off" : ""}" type="button" data-action="toggle-filter" data-status="${status}" ${status === "available" && !state.settings.showAvailability ? "disabled aria-disabled=\"true\"" : ""}>
                    <span class="legend-dot ${status}"></span>${label}
                  </button>`;
                }).join("")}
              </div>
            </div>
            <div class="calendar-scroll">
              ${state.calendarView === "month" ? renderMonthView() : state.calendarView === "week" ? renderWeekView() : renderDayView()}
            </div>
          </div>
        `;
      }

      function calendarLabel() {
        if (state.calendarView === "month") return `${capitalize(monthNames[state.cursor.getMonth()])} ${state.cursor.getFullYear()}`;
        if (state.calendarView === "week") {
          const start = startOfWeek(state.selectedDate);
          const end = addDays(start, 6);
          if (start.getMonth() === end.getMonth()) return `${start.getDate()}–${end.getDate()} ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
          return `${start.getDate()} ${monthNames[start.getMonth()]} – ${end.getDate()} ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
        }
        return capitalize(formatDate(state.selectedDate, { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
      }

      function isEventVisible(event) {
        if (!state.filters.has(event.status)) return false;
        if (event.status === "available" && !state.settings.showAvailability) return false;
        return true;
      }

      function renderMonthView() {
        const year = state.cursor.getFullYear();
        const month = state.cursor.getMonth();
        const first = new Date(year, month, 1, 12);
        const offset = (first.getDay() + 6) % 7;
        const start = addDays(first, -offset);
        const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));

        return `
          <div class="month-grid">
            ${weekdayNames.map(day => `<div class="weekday-head">${day}</div>`).join("")}
            ${days.map(date => {
              const outside = date.getMonth() !== month;
              const today = sameDate(date, demoToday);
              const selected = sameDate(date, state.selectedDate);
              const allEvents = eventsForDate(date).filter(isEventVisible);
              const visible = allEvents.slice(0, 2);
              const extra = allEvents.length - visible.length;
              return `
                <div class="day-cell ${outside ? "outside" : ""} ${today ? "today" : ""} ${selected ? "selected" : ""}" data-date="${toISO(date)}">
                  <div class="day-top">
                    <button class="day-number" type="button" data-action="select-day" data-date="${toISO(date)}" aria-label="${formatDate(date, { dateStyle: "full" })}">${date.getDate()}</button>
                    <button class="quick-add" type="button" data-action="new-booking-date" data-date="${toISO(date)}" aria-label="Ny bokning ${formatDate(date, { dateStyle: "long" })}">+</button>
                  </div>
                  <div class="events">
                    ${visible.map(renderEventChip).join("")}
                    ${extra > 0 ? `<button class="more-events" type="button" data-action="show-day" data-date="${toISO(date)}">+ ${extra} till</button>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderEventChip(event) {
        return `
          <button class="event-chip ${event.status}" type="button" data-action="open-event" data-event-id="${event.id}">
            <span class="event-time">${escapeHtml(event.time)}</span>
            <span class="event-title">${escapeHtml(event.title)}</span>
          </button>
        `;
      }

      function renderWeekView() {
        const start = startOfWeek(state.selectedDate);
        const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
        days.forEach(d => ensureMonthEvents(d.getFullYear(), d.getMonth()));
        const hours = Array.from({ length: 13 }, (_, i) => 8 + i);

        let html = `<div class="week-wrap"><div class="week-grid"><div class="week-corner"></div>`;
        html += days.map((date, i) => `
          <button class="week-day-head ${sameDate(date, demoToday) ? "today" : ""}" type="button" data-action="show-day" data-date="${toISO(date)}">
            <div class="week-day-name">${shortWeekdays[i]}</div>
            <div class="week-day-date">${date.getDate()}</div>
          </button>
        `).join("");

        hours.forEach(hour => {
          html += `<div class="week-time">${String(hour).padStart(2, "0")}:00</div>`;
          days.forEach(date => {
            const dateEvents = eventsForDate(date).filter(event => isEventVisible(event) && Number(event.time.slice(0, 2)) === hour);
            html += `<div class="week-slot" data-action="new-booking-slot" data-date="${toISO(date)}" data-time="${String(hour).padStart(2, "0")}:00">`;
            html += dateEvents.map(event => `
              <button class="week-event ${event.status}" type="button" data-action="open-event" data-event-id="${event.id}">
                <strong>${escapeHtml(event.time)}</strong><br>${escapeHtml(event.title)}
              </button>
            `).join("");
            html += `</div>`;
          });
        });
        html += `</div></div>`;
        return html;
      }

      function renderDayView() {
        ensureMonthEvents(state.selectedDate.getFullYear(), state.selectedDate.getMonth());
        const hours = Array.from({ length: 13 }, (_, i) => 8 + i);
        const dayEvents = eventsForDate(state.selectedDate).filter(isEventVisible);
        const booked = dayEvents.filter(e => e.status === "booked").length;
        const available = dayEvents.filter(e => e.status === "available").length;

        return `
          <div class="day-view">
            <div class="day-agenda">
              ${hours.map(hour => {
                const time = `${String(hour).padStart(2, "0")}:00`;
                const events = dayEvents.filter(event => Number(event.time.slice(0, 2)) === hour);
                return `
                  <div class="agenda-row">
                    <div class="agenda-time">${time}</div>
                    <div class="agenda-slot" data-action="new-booking-slot" data-date="${toISO(state.selectedDate)}" data-time="${time}">
                      ${events.map(event => `
                        <button class="agenda-event ${event.status}" type="button" data-action="open-event" data-event-id="${event.id}">
                          <span>
                            <span class="agenda-title">${escapeHtml(event.time)} · ${escapeHtml(event.title)}</span>
                            <span class="agenda-meta">${escapeHtml(event.customer || event.resource || statusLabel(event.status))}</span>
                          </span>
                          ${event.duration ? `<span class="status-pill">${event.duration} min</span>` : ""}
                        </button>
                      `).join("")}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
            <aside class="day-side">
              <section class="panel">
                <div class="panel-head"><h3 class="panel-title">Dagens översikt</h3></div>
                <div class="summary-row">${icon("calendar")}<strong>${booked}</strong><span>Bokningar</span></div>
                <div class="summary-row">${icon("clock")}<strong>${available}</strong><span>Lediga tider</span></div>
                <div class="summary-row">${icon("users")}<strong>${new Set(dayEvents.filter(e => e.customer).map(e => e.customer)).size}</strong><span>Kunder</span></div>
              </section>
              <section class="panel">
                <div class="panel-head"><h3 class="panel-title">Snabbåtgärder</h3></div>
                <button class="primary-button" style="width:100%" type="button" data-action="new-booking-date" data-date="${toISO(state.selectedDate)}">${icon("plus")}Ny bokning</button>
                <button class="secondary-button" style="width:100%;margin-top:9px" type="button" data-action="view" data-view="month">Visa månad</button>
              </section>
            </aside>
          </div>
        `;
      }

      function statusLabel(status) {
        return { booked: "Bokad", available: "Ledig tid", pause: "Paus", closed: "Stängt" }[status] || status;
      }

      function renderOverview() {
        ensureMonthEvents(2025, 4);
        const monthPrefix = "2025-05";
        const monthBookings = state.events.filter(e => e.status === "booked" && e.date.startsWith(monthPrefix));
        const todayEvents = eventsForDate(demoToday).filter(e => e.status === "booked");
        const upcoming = bookedEventsFrom(demoToday).slice(0, 5);
        return `
          <div class="page-stack">
            <section class="hero-panel">
              <div>
                <h2>God morgon, Emma</h2>
                <p>Här är dagens läge på Studio Aura. Kalendern har ${todayEvents.length} bokningar idag och två lediga tider kvar.</p>
              </div>
              <div class="hero-orb" aria-hidden="true"></div>
            </section>

            <div class="stats-grid">
              ${statCard("Bokningar idag", todayEvents.length, "2 fler än i går", "calendar", "bookings")}
              ${statCard("Månadens bokningar", monthBookings.length, "Maj 2025", "grid", "bookings")}
              ${statCard("Aktiva kunder", state.customers.length, "3 nya den här veckan", "users", "customers")}
              ${statCard("Lediga tider", eventsForDate(demoToday).filter(e => e.status === "available").length, "Idag", "clock", "bookings")}
            </div>

            <div class="two-col">
              <section class="panel">
                <div class="panel-head">
                  <h3 class="panel-title">Dagens schema</h3>
                  <button class="secondary-button" type="button" data-action="nav" data-section="bookings">Öppna kalender</button>
                </div>
                <div class="clean-list">
                  ${upcoming.map(event => `
                    <button class="clean-row" type="button" data-action="open-event" data-event-id="${event.id}" style="width:100%;text-align:left">
                      <span class="clean-time">${event.time}</span>
                      <span><span class="clean-title">${escapeHtml(event.title)}</span><span class="clean-sub">${escapeHtml(event.customer)} · ${escapeHtml(event.resource)}</span></span>
                      <span class="status-pill">Bokad</span>
                    </button>
                  `).join("")}
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><h3 class="panel-title">Beläggning</h3><span class="status-pill">Idag</span></div>
                <div class="progress-list">
                  ${progress("Solarium 1", 82)}
                  ${progress("Solarium 2", 67)}
                  ${progress("Solarium 3", 74)}
                  ${progress("Behandlingsrum", 58)}
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function statCard(label, value, foot, iconName, section) {
        return `
          <article class="stat-card" data-action="nav" data-section="${section}" role="button" tabindex="0">
            <div class="stat-top"><span>${label}</span><span class="stat-icon">${icon(iconName)}</span></div>
            <div class="stat-value">${value}</div>
            <div class="stat-foot">${foot}</div>
          </article>
        `;
      }
      function progress(label, value) {
        return `<div><div class="progress-label"><span>${label}</span><strong>${value}%</strong></div><div class="progress-track"><div class="progress-bar" style="width:${value}%"></div></div></div>`;
      }

      function renderCustomers() {
        const query = state.customerQuery.trim().toLowerCase();
        const filtered = state.customers.filter(customer => [customer.name, customer.email, customer.phone].some(v => v.toLowerCase().includes(query)));
        return `
          <div class="page-stack">
            <div class="section-toolbar">
              <label class="search-box">
                ${icon("search")}
                <input id="customerSearch" type="search" value="${escapeHtml(state.customerQuery)}" placeholder="Sök namn, e-post eller telefon…" aria-label="Sök kunder" />
              </label>
              <span class="status-pill">${filtered.length} kunder</span>
            </div>
            <section class="panel" style="padding:0;overflow:hidden">
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Kund</th><th>Telefon</th><th>Besök</th><th>Senaste besök</th></tr></thead>
                  <tbody>
                    ${filtered.map(customer => `
                      <tr data-action="customer-detail" data-customer-id="${customer.id}">
                        <td><div class="customer-cell"><span class="customer-avatar">${initials(customer.name)}</span><span><strong>${escapeHtml(customer.name)}</strong><br><span style="color:var(--muted);font-size:11px">${escapeHtml(customer.email)}</span></span></div></td>
                        <td>${escapeHtml(customer.phone)}</td>
                        <td>${customer.visits}</td>
                        <td>${formatDate(dateFromISO(customer.lastVisit), { day: "numeric", month: "short", year: "numeric" })}</td>
                      </tr>
                    `).join("") || `<tr><td colspan="4"><div class="empty-state"><h3>Ingen träff</h3><p>Prova ett annat sökord.</p></div></td></tr>`}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        `;
      }

      function initials(name) { return name.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase(); }

      function renderServices() {
        return `
          <div class="page-stack">
            <div class="section-toolbar"><p style="margin:0;color:var(--muted)">Hantera behandlingar, soltider och priser.</p><span class="status-pill">${services.length} aktiva</span></div>
            <div class="card-grid">
              ${services.map((service, index) => `
                <article class="service-card">
                  <span class="status-pill">Aktiv</span>
                  <h3>${escapeHtml(service.name)}</h3>
                  <p>${escapeHtml(service.description)}</p>
                  <div class="service-meta"><span>${service.duration} min</span><span class="price">${service.price ? `${service.price} kr` : "Kostnadsfri"}</span></div>
                  <button class="icon-button" style="position:absolute;top:14px;right:14px;width:34px;height:34px" type="button" data-action="service-detail" data-service-index="${index}" aria-label="Redigera tjänst">${icon("edit")}</button>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderStaff() {
        return `
          <div class="page-stack">
            <div class="section-toolbar"><p style="margin:0;color:var(--muted)">Personal, roller och tillgänglighet.</p><span class="status-pill">2 på plats</span></div>
            <div class="card-grid">
              ${staff.map((person, index) => `
                <article class="person-card">
                  <div class="person-top"><span class="person-avatar">${person.initials}</span><span><h3 style="margin:0">${person.name}</h3><p>${person.role}</p></span></div>
                  <div class="person-status">${person.status}</div>
                  <div class="service-meta"><span style="color:var(--muted);font-size:12px">${person.specialty}</span><button class="icon-button" type="button" data-action="staff-detail" data-staff-index="${index}" style="width:34px;height:34px">${icon("edit")}</button></div>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="settings-grid">
            <section class="panel">
              <div class="panel-head"><h3 class="panel-title">Bokningsinställningar</h3></div>
              ${settingToggle("reminders", "Automatiska påminnelser", "Skicka en påminnelse till kunden före bokad tid.")}
              ${settingToggle("autoConfirm", "Bekräfta bokningar automatiskt", "Nya bokningar blir direkt bekräftade.")}
              ${settingToggle("showAvailability", "Visa lediga tider", "Visa lediga tider direkt i månadskalendern.")}
              ${settingToggle("compactMode", "Kompakt kalender", "Minska höjden på kalenderns dagrutor.")}
              <div class="setting-row">
                <div><div class="setting-title">Återställ demo</div><div class="setting-sub">Återställ alla bokningar och ändringar till ursprungsläget.</div></div>
                <button class="secondary-button" type="button" data-action="reset-demo">${icon("reset")}Återställ</button>
              </div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3 class="panel-title">Öppettider</h3></div>
              <div class="hours-grid">
                ${Object.entries(state.settings.openingHours).map(([day, range]) => `
                  <div class="hours-row">
                    <strong style="font-family:var(--serif);font-size:13px">${day}</strong>
                    <input type="text" value="${range[0]}" data-hour-day="${day}" data-hour-index="0" aria-label="${day} öppnar" />
                    <span>–</span>
                    <input type="text" value="${range[1]}" data-hour-day="${day}" data-hour-index="1" aria-label="${day} stänger" />
                  </div>
                `).join("")}
              </div>
            </section>
          </div>
        `;
      }

      function settingToggle(key, title, description) {
        return `<div class="setting-row"><div><div class="setting-title">${title}</div><div class="setting-sub">${description}</div></div><button class="toggle ${state.settings[key] ? "on" : ""}" type="button" data-action="toggle-setting" data-setting="${key}" aria-pressed="${state.settings[key]}"></button></div>`;
      }

      document.addEventListener("click", event => {
        if (event.target.matches("[data-modal-backdrop]")) {
          closeModal();
          return;
        }
        const target = event.target.closest("[data-action]");
        if (!target) {
          closePopovers();
          return;
        }

        const action = target.dataset.action;
        if (!target.closest(".popover")) closePopovers();

        if (action === "nav") {
          state.activeSection = target.dataset.section;
          persist();
          closeSidebar();
          renderApp();
        } else if (action === "view") {
          state.calendarView = target.dataset.view;
          if (state.calendarView === "month") state.cursor = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12);
          persist();
          renderApp();
        } else if (action === "calendar-prev" || action === "calendar-next") {
          const delta = action === "calendar-next" ? 1 : -1;
          navigateCalendar(delta);
        } else if (action === "calendar-today") {
          state.selectedDate = new Date(demoToday);
          state.cursor = new Date(demoToday.getFullYear(), demoToday.getMonth(), 1, 12);
          persist();
          renderApp();
        } else if (action === "select-day") {
          const date = dateFromISO(target.dataset.date);
          state.selectedDate = date;
          if (date.getMonth() !== state.cursor.getMonth() || date.getFullYear() !== state.cursor.getFullYear()) state.cursor = new Date(date.getFullYear(), date.getMonth(), 1, 12);
          persist();
          renderApp();
        } else if (action === "show-day") {
          state.selectedDate = dateFromISO(target.dataset.date);
          state.calendarView = "day";
          persist();
          renderApp();
        } else if (action === "new-booking" || action === "new-booking-date") {
          openBookingModal({ date: target.dataset.date || toISO(state.selectedDate) });
        } else if (action === "new-booking-slot") {
          if (event.target.closest("[data-event-id]")) return;
          openBookingModal({ date: target.dataset.date, time: target.dataset.time });
        } else if (action === "open-event") {
          event.stopPropagation();
          openEvent(target.dataset.eventId);
        } else if (action === "toggle-filter") {
          const status = target.dataset.status;
          state.filters.has(status) ? state.filters.delete(status) : state.filters.add(status);
          persist();
          renderApp();
        } else if (action === "open-sidebar") {
          document.getElementById("sidebar").classList.add("open");
          document.getElementById("mobileScrim").classList.add("show");
        } else if (action === "close-sidebar") {
          closeSidebar();
        } else if (action === "notifications") {
          openNotifications(target);
        } else if (action === "profile-menu") {
          openProfileMenu(target);
        } else if (action === "new-customer") {
          openCustomerModal();
        } else if (action === "customer-detail") {
          openCustomerDetail(target.dataset.customerId);
        } else if (action === "new-service") {
          showToast("Tjänsteformuläret är markerat som nästa prototypsteg.");
        } else if (action === "new-staff") {
          showToast("Personalformuläret är markerat som nästa prototypsteg.");
        } else if (action === "service-detail") {
          const service = services[Number(target.dataset.serviceIndex)];
          showToast(`${service.name}: redigeringsvyn kan byggas i nästa steg.`);
        } else if (action === "staff-detail") {
          const person = staff[Number(target.dataset.staffIndex)];
          showToast(`${person.name}: profilvyn kan byggas i nästa steg.`);
        } else if (action === "toggle-setting") {
          const key = target.dataset.setting;
          state.settings[key] = !state.settings[key];
          persist();
          renderApp();
        } else if (action === "save-settings") {
          saveOpeningHours();
          persist();
          showToast("Inställningarna är sparade.");
        } else if (action === "reset-demo") {
          if (confirm("Vill du återställa hela prototypen? Alla lokala ändringar tas bort.")) {
            try { localStorage.removeItem(STORAGE_KEY); } catch {}
            location.reload();
          }
        } else if (action === "close-modal") {
          closeModal();
        } else if (action === "delete-event") {
          deleteEvent(target.dataset.eventId);
        } else if (action === "logout") {
          showToast("Utloggning är endast en del av mockupen.");
        } else if (action === "profile") {
          showToast("Profilvyn är förberedd för nästa steg.");
        }
      });

      document.addEventListener("input", event => {
        if (event.target.id === "customerSearch") {
          state.customerQuery = event.target.value;
          const cursor = event.target.selectionStart;
          renderContent();
          const input = document.getElementById("customerSearch");
          input.focus();
          input.setSelectionRange(cursor, cursor);
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeModal();
          closePopovers();
          closeSidebar();
        }
        if ((event.key === "Enter" || event.key === " ") && event.target.matches(".stat-card")) {
          event.preventDefault();
          event.target.click();
        }
      });

      function navigateCalendar(delta) {
        if (state.calendarView === "month") {
          state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + delta, 1, 12);
          state.selectedDate = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), Math.min(state.selectedDate.getDate(), new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 0).getDate()), 12);
          ensureMonthEvents(state.cursor.getFullYear(), state.cursor.getMonth());
        } else if (state.calendarView === "week") {
          state.selectedDate = addDays(state.selectedDate, delta * 7);
          state.cursor = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12);
        } else {
          state.selectedDate = addDays(state.selectedDate, delta);
          state.cursor = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12);
        }
        persist();
        renderApp();
      }

      function openEvent(eventId) {
        const event = state.events.find(item => item.id === eventId);
        if (!event) return;
        if (event.status === "available") {
          openBookingModal({ date: event.date, time: event.time, sourceSlotId: event.id });
          return;
        }
        openBookingModal({ eventId: event.id });
      }

      function openBookingModal({ eventId = "", date = toISO(state.selectedDate), time = "10:00", sourceSlotId = "" } = {}) {
        const existing = eventId ? state.events.find(item => item.id === eventId) : null;
        const model = existing || {
          date,
          time,
          title: "Soltid 20 min",
          customer: "",
          resource: "Solarium 1",
          duration: 20,
          status: "booked",
          notes: ""
        };
        const isEdit = Boolean(existing);
        const customerOptions = state.customers.map(customer => `<option value="${escapeHtml(customer.name)}" ${model.customer === customer.name ? "selected" : ""}>${escapeHtml(customer.name)}</option>`).join("");
        const serviceOptions = services.map(service => `<option value="${escapeHtml(service.name)}" data-duration="${service.duration}" ${model.title === service.name ? "selected" : ""}>${escapeHtml(service.name)}</option>`).join("");

        document.getElementById("modalRoot").innerHTML = `
          <div class="modal-backdrop" data-modal-backdrop>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bookingModalTitle">
              <div class="modal-head">
                <h2 class="modal-title" id="bookingModalTitle">${isEdit ? "Redigera bokning" : "Ny bokning"}</h2>
                <button class="icon-button" type="button" data-action="close-modal" aria-label="Stäng">✕</button>
              </div>
              <form id="bookingForm">
                <div class="modal-body">
                  <input type="hidden" name="eventId" value="${escapeHtml(eventId)}" />
                  <input type="hidden" name="sourceSlotId" value="${escapeHtml(sourceSlotId)}" />
                  <div class="form-grid">
                    <div class="field"><label for="bookingDate">Datum</label><input id="bookingDate" name="date" type="date" value="${escapeHtml(model.date)}" required /></div>
                    <div class="field"><label for="bookingTime">Tid</label><input id="bookingTime" name="time" type="time" value="${escapeHtml(model.time)}" required /></div>
                    <div class="field full"><label for="bookingService">Tjänst</label><select id="bookingService" name="title" required>${serviceOptions}<option value="Paus" ${model.title === "Paus" ? "selected" : ""}>Paus</option><option value="Stängt" ${model.title === "Stängt" ? "selected" : ""}>Stängt</option></select></div>
                    <div class="field"><label for="bookingCustomer">Kund</label><select id="bookingCustomer" name="customer"><option value="">Välj kund…</option>${customerOptions}</select></div>
                    <div class="field"><label for="bookingResource">Rum / solarium</label><select id="bookingResource" name="resource">
                      ${["Solarium 1", "Solarium 2", "Solarium 3", "Rödljus 1", "Behandlingsrum", "Rum 1"].map(value => `<option value="${value}" ${model.resource === value ? "selected" : ""}>${value}</option>`).join("")}
                    </select></div>
                    <div class="field"><label for="bookingDuration">Längd (min)</label><input id="bookingDuration" name="duration" type="number" min="0" step="5" value="${Number(model.duration) || 20}" /></div>
                    <div class="field"><label for="bookingStatus">Status</label><select id="bookingStatus" name="status">
                      ${[["booked","Bokad"],["available","Ledig tid"],["pause","Paus"],["closed","Stängt"]].map(([value,label]) => `<option value="${value}" ${model.status === value ? "selected" : ""}>${label}</option>`).join("")}
                    </select></div>
                    <div class="field full"><label for="bookingNotes">Anteckning</label><textarea id="bookingNotes" name="notes" placeholder="Valfri intern anteckning…">${escapeHtml(model.notes)}</textarea></div>
                  </div>
                </div>
                <div class="modal-foot">
                  <div>${isEdit ? `<button class="danger-button" type="button" data-action="delete-event" data-event-id="${eventId}">${icon("trash")}Ta bort</button>` : ""}</div>
                  <div class="modal-foot-right">
                    <button class="secondary-button" type="button" data-action="close-modal">Avbryt</button>
                    <button class="primary-button" type="submit">${icon("check")}Spara bokning</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        `;

        const form = document.getElementById("bookingForm");
        form.addEventListener("submit", saveBooking);
        const serviceSelect = document.getElementById("bookingService");
        serviceSelect.addEventListener("change", () => {
          const selected = services.find(service => service.name === serviceSelect.value);
          if (selected) document.getElementById("bookingDuration").value = selected.duration;
          const status = document.getElementById("bookingStatus");
          if (serviceSelect.value === "Paus") status.value = "pause";
          else if (serviceSelect.value === "Stängt") status.value = "closed";
          else status.value = "booked";
        });
        setTimeout(() => document.getElementById("bookingDate")?.focus(), 20);
      }

      function saveBooking(event) {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const eventId = formData.get("eventId");
        const sourceSlotId = formData.get("sourceSlotId");
        const model = {
          id: eventId || uid("booking"),
          date: formData.get("date"),
          time: formData.get("time"),
          title: formData.get("title"),
          customer: formData.get("customer"),
          resource: formData.get("resource"),
          duration: Number(formData.get("duration")) || 0,
          status: formData.get("status"),
          notes: formData.get("notes")
        };

        if (eventId) {
          const index = state.events.findIndex(item => item.id === eventId);
          if (index >= 0) state.events[index] = model;
        } else {
          if (sourceSlotId) state.events = state.events.filter(item => item.id !== sourceSlotId);
          state.events.push(model);
        }

        state.selectedDate = dateFromISO(model.date);
        state.cursor = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12);
        persist();
        closeModal();
        renderApp();
        showToast(eventId ? "Bokningen är uppdaterad." : "Bokningen är skapad.");
      }

      function deleteEvent(eventId) {
        if (!confirm("Vill du ta bort bokningen?")) return;
        state.events = state.events.filter(item => item.id !== eventId);
        persist();
        closeModal();
        renderApp();
        showToast("Bokningen är borttagen.");
      }

      function openCustomerModal() {
        document.getElementById("modalRoot").innerHTML = `
          <div class="modal-backdrop" data-modal-backdrop>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle">
              <div class="modal-head"><h2 class="modal-title" id="customerModalTitle">Ny kund</h2><button class="icon-button" type="button" data-action="close-modal">✕</button></div>
              <form id="customerForm">
                <div class="modal-body"><div class="form-grid">
                  <div class="field full"><label>Namn</label><input name="name" required autofocus /></div>
                  <div class="field"><label>E-post</label><input name="email" type="email" /></div>
                  <div class="field"><label>Telefon</label><input name="phone" /></div>
                </div></div>
                <div class="modal-foot"><div></div><div class="modal-foot-right"><button class="secondary-button" type="button" data-action="close-modal">Avbryt</button><button class="primary-button" type="submit">${icon("check")}Spara kund</button></div></div>
              </form>
            </div>
          </div>
        `;
        document.getElementById("customerForm").addEventListener("submit", event => {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          state.customers.push({ id: uid("customer"), name: data.get("name"), email: data.get("email"), phone: data.get("phone"), visits: 0, lastVisit: toISO(demoToday) });
          persist();
          closeModal();
          renderApp();
          showToast("Kunden är tillagd.");
        });
      }

      function openCustomerDetail(customerId) {
        const customer = state.customers.find(item => item.id === customerId);
        if (!customer) return;
        document.getElementById("modalRoot").innerHTML = `
          <div class="modal-backdrop" data-modal-backdrop>
            <div class="modal" role="dialog" aria-modal="true">
              <div class="modal-head"><h2 class="modal-title">${escapeHtml(customer.name)}</h2><button class="icon-button" type="button" data-action="close-modal">✕</button></div>
              <div class="modal-body">
                <div class="person-top"><span class="person-avatar">${initials(customer.name)}</span><span><h3 style="margin:0;font-family:var(--serif);font-size:22px">Kundprofil</h3><p style="margin:5px 0 0;color:var(--muted)">${customer.visits} registrerade besök</p></span></div>
                <div class="clean-list" style="margin-top:22px">
                  <div class="clean-row"><span>${icon("mail")}</span><span><span class="clean-title">E-post</span><span class="clean-sub">${escapeHtml(customer.email || "Inte angiven")}</span></span></div>
                  <div class="clean-row"><span>${icon("phone")}</span><span><span class="clean-title">Telefon</span><span class="clean-sub">${escapeHtml(customer.phone || "Inte angiven")}</span></span></div>
                  <div class="clean-row"><span>${icon("calendar")}</span><span><span class="clean-title">Senaste besök</span><span class="clean-sub">${formatDate(dateFromISO(customer.lastVisit), { dateStyle: "long" })}</span></span></div>
                </div>
              </div>
              <div class="modal-foot"><div></div><div class="modal-foot-right"><button class="secondary-button" type="button" data-action="close-modal">Stäng</button><button class="primary-button" type="button" data-action="new-booking">${icon("plus")}Ny bokning</button></div></div>
            </div>
          </div>
        `;
      }

      function openNotifications(button) {
        const rect = button.getBoundingClientRect();
        document.getElementById("popoverRoot").innerHTML = `
          <div class="popover" style="top:${rect.bottom + 8}px;left:${Math.max(12, rect.right - 250)}px">
            <div class="popover-title">Notiser</div>
            <button class="popover-item" type="button"><span class="notification-dot"></span><span><strong>Ny bokning</strong><div class="popover-small">Anna bokade Soltid 20 min kl. 10:00.</div></span></button>
            <button class="popover-item" type="button"><span class="notification-dot" style="background:#c8b795"></span><span><strong>Påminnelse skickad</strong><div class="popover-small">Dagens kunder har fått sina påminnelser.</div></span></button>
          </div>
        `;
      }

      function openProfileMenu(button) {
        const rect = button.getBoundingClientRect();
        document.getElementById("popoverRoot").innerHTML = `
          <div class="popover" style="top:${rect.bottom + 8}px;left:${Math.max(12, rect.right - 220)}px;width:220px">
            <div class="popover-title">Emma Karlsson</div>
            <button class="popover-item" type="button" data-action="profile">${icon("user")}<span>Min profil</span></button>
            <button class="popover-item" type="button" data-action="logout">${icon("arrow")}<span>Logga ut</span></button>
          </div>
        `;
      }

      function closePopovers() { document.getElementById("popoverRoot").innerHTML = ""; }
      function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
      function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("mobileScrim").classList.remove("show"); }

      function saveOpeningHours() {
        document.querySelectorAll("[data-hour-day]").forEach(input => {
          const day = input.dataset.hourDay;
          const index = Number(input.dataset.hourIndex);
          if (!state.settings.openingHours[day]) state.settings.openingHours[day] = ["", ""];
          state.settings.openingHours[day][index] = input.value;
        });
      }

      let toastTimer;
      function showToast(message) {
        clearTimeout(toastTimer);
        const toast = document.getElementById("toast");
        toast.innerHTML = `${icon("check")}<span>${escapeHtml(message)}</span>`;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
      }
    })();
  </script>
</body>
</html>
